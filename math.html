<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#EA580C">
  <title>Math</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
    body {
      font-family: 'Nunito', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      display: flex; flex-direction: column; height: 100dvh; background: #111;
    }
    #card {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #FB923C, #C2410C);
      position: relative; overflow: hidden; user-select: none;
    }
    .problem {
      display: flex; align-items: center; justify-content: center;
      gap: clamp(6px, 2vw, 20px);
      font-size: clamp(80px, 22vw, 200px); font-weight: 900; line-height: 1;
    }
    .num { color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .op  { color: #FDE68A; text-shadow: 0 4px 20px rgba(0,0,0,0.25); }
    .eq  { color: rgba(255,255,255,0.5); font-size: 0.75em; }
    .slide-in { animation: slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes slideUp { from { transform: translateY(28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    #card-badge {
      position: absolute; top: 14px; right: 14px; font-size: 16px;
      font-weight: 800; color: rgba(255,255,255,0.55); pointer-events: none;
    }
    #bottom-bar {
      background: #fff; height: 110px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 0 12px; box-shadow: 0 -3px 16px rgba(0,0,0,0.18);
    }
    #answer-input {
      flex: 1; min-width: 0;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(36px, 9vw, 62px); font-weight: 900;
      color: #EA580C; text-align: center;
      border: none; border-bottom: 3px solid #EA580C;
      outline: none; background: transparent; padding: 4px 8px;
    }
    #answer-input::placeholder { color: rgba(234,88,12,0.28); }
    #answer-input.wrong { animation: shake 0.38s ease-in-out; }
    .btn {
      background: none; border: none; cursor: pointer; font-size: 34px;
      padding: 8px; border-radius: 50%; transition: transform 0.1s, background 0.1s;
      -webkit-tap-highlight-color: transparent; line-height: 1; flex-shrink: 0;
    }
    .btn:active { transform: scale(0.88); background: rgba(0,0,0,0.06); }
    #check-btn { color: #EA580C; font-size: 30px; font-weight: 900; }
    #skip-btn { font-size: 26px; opacity: 0.5; }
    #home-btn  { font-size: 26px; opacity: 0.5; }
    #celebration { position: fixed; inset: 0; pointer-events: none; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .confetti-wrap { position: absolute; inset: 0; overflow: hidden; }
    .cp { position: absolute; animation: cfall linear forwards; }
    @keyframes cfall { from { transform: translateY(-80px) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(600deg); opacity: 0; } }
    .big-answer {
      font-family: 'Nunito', sans-serif; font-size: clamp(64px, 18vw, 160px); font-weight: 900;
      background: rgba(255,255,255,0.93); border-radius: 20px; padding: 12px 48px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25); animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
      color: #EA580C;
    }
    @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%,100%{transform:translateX(0);}20%{transform:translateX(-10px);}40%{transform:translateX(10px);}60%{transform:translateX(-8px);}80%{transform:translateX(5px);} }
  </style>
</head>
<body>
<div id="card">
  <div class="problem slide-in" id="problem">
    <span class="num" id="num-a">8</span>
    <span class="op"  id="op">+</span>
    <span class="num" id="num-b">5</span>
    <span class="eq">=&nbsp;?</span>
  </div>
  <span id="card-badge">1/176</span>
</div>
<div id="bottom-bar">
  <button class="btn" id="home-btn"  aria-label="Home">🏠</button>
  <button class="btn" id="speak-btn" aria-label="Hear problem">🔊</button>
  <input id="answer-input" type="text" inputmode="decimal"
    placeholder="?" autocomplete="off" autocorrect="off"
    autocapitalize="none" spellcheck="false" />
  <button class="btn" id="check-btn" aria-label="Check">✓</button>
  <button class="btn" id="skip-btn"  aria-label="Next">➡️</button>
</div>
<div id="celebration"></div>
<script>
function genProblems() {
  const p = [];
  for (let a = 0; a <= 10; a++)
    for (let b = 0; b <= 10; b++)
      p.push({ a, op: '+', b, ans: a + b });
  for (let a = 1; a <= 10; a++)
    for (let b = 1; b <= a; b++)
      p.push({ a, op: '-', b, ans: a - b });
  for (let i = p.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  return p;
}

const PROBLEMS = genProblems();
const state = { idx: 0, mastered: new Set(), celebrating: false };

function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem('math_v1') || 'null');
    if (d) state.mastered = new Set(d.mastered || []);
  } catch(_) {}
}
function saveProgress() {
  try { localStorage.setItem('math_v1', JSON.stringify({ mastered: [...state.mastered] })); } catch(_) {}
}

const cur = () => PROBLEMS[state.idx];
const probKey = p => p.a + p.op + p.b;

function render(animate) {
  const p = cur();
  document.getElementById('num-a').textContent = p.a;
  document.getElementById('op').textContent    = p.op;
  document.getElementById('num-b').textContent = p.b;
  document.getElementById('card-badge').textContent =
    (state.idx + 1) + '/' + PROBLEMS.length +
    (state.mastered.size ? '  ·  ✓ ' + state.mastered.size : '');
  if (animate) anim('problem');
}

function anim(id) {
  const el = document.getElementById(id);
  el.classList.remove('slide-in'); void el.offsetWidth; el.classList.add('slide-in');
}

function next() {
  state.idx = (state.idx + 1) % PROBLEMS.length;
  document.getElementById('answer-input').value = '';
  render(true);
}

function speakProblem() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const p = cur();
  const u = new SpeechSynthesisUtterance(p.a + (p.op === '+' ? ' plus ' : ' minus ') + p.b);
  u.lang = 'en-US'; u.rate = 0.82; u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

function checkTyped() {
  if (state.celebrating) return;
  const val = document.getElementById('answer-input').value.trim();
  if (!val) return;
  if (parseInt(val, 10) === cur().ans) {
    celebrate();
  } else {
    shake();
  }
}

function celebrate() {
  state.celebrating = true;
  state.mastered.add(probKey(cur()));
  saveProgress();
  const ov = document.getElementById('celebration');
  ov.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'confetti-wrap';
  const EM = ['⭐','🌟','✨','🎉','🎊','🌈','💛','🧡','❤️'];
  for (let i = 0; i < 28; i++) {
    const cp = document.createElement('div'); cp.className = 'cp';
    cp.textContent = EM[i % EM.length];
    cp.style.cssText = 'left:' + Math.random()*100 + 'vw;top:-70px;font-size:' +
      (18 + Math.random()*26) + 'px;animation-duration:' + (0.7 + Math.random()*0.9) +
      's;animation-delay:' + Math.random()*0.35 + 's;';
    wrap.appendChild(cp);
  }
  ov.appendChild(wrap);
  const bw = document.createElement('div'); bw.className = 'big-answer';
  bw.textContent = cur().ans;
  ov.appendChild(bw);
  setTimeout(() => { ov.innerHTML = ''; state.celebrating = false; next(); }, 1350);
}

function shake() {
  const el = document.getElementById('answer-input');
  el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  setTimeout(() => { el.classList.remove('wrong'); el.value = ''; }, 400);
}

document.getElementById('speak-btn').addEventListener('click', e => { e.stopPropagation(); speakProblem(); });
document.getElementById('check-btn').addEventListener('click', e => { e.stopPropagation(); checkTyped(); });
document.getElementById('skip-btn') .addEventListener('click', e => { e.stopPropagation(); next(); });
document.getElementById('home-btn') .addEventListener('click', e => { e.stopPropagation(); window.location.href = 'scout.html'; });
document.getElementById('answer-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkTyped(); } });

loadProgress(); render(false);
</script>
</body>
</html>
