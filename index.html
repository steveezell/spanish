<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111">
  <title>Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
    body {
      font-family: 'Nunito', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      display: flex; height: 100dvh;
    }
    .panel {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      cursor: pointer; position: relative; overflow: hidden;
      text-decoration: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .panel::after {
      content: ''; position: absolute; inset: 0; background: transparent;
      transition: background 0.12s; pointer-events: none;
    }
    .panel:active::after { background: rgba(0,0,0,0.14); }
    #scout { background: linear-gradient(160deg, #FB923C, #EA580C); border-right: 3px solid rgba(255,255,255,0.25); }
    #arbor { background: linear-gradient(160deg, #3B82F6, #2563EB); }
    .kid-icon { font-size: clamp(44px, 10vw, 88px); line-height: 1; }
    .kid-name {
      font-size: clamp(72px, 19vw, 170px); font-weight: 900; color: #fff;
      text-shadow: 0 4px 24px rgba(0,0,0,0.22); letter-spacing: -0.03em; line-height: 1;
    }
    .kid-sub {
      font-size: clamp(16px, 3.5vw, 28px); font-weight: 800;
      color: rgba(255,255,255,0.6); letter-spacing: 0.04em; text-transform: uppercase;
    }
    .tap-hint {
      position: absolute; bottom: 22px; font-size: 22px; opacity: 0.45;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  </style>
</head>
<body>
  <a id="scout" class="panel" href="scout.html">
    <span class="kid-icon">🎮</span>
    <span class="kid-name">Scout</span>
    <span class="kid-sub">3 Games</span>
    <span class="tap-hint">▼</span>
  </a>
  <a id="arbor" class="panel" href="silabas.html">
    <span class="kid-icon">📖</span>
    <span class="kid-name">Arbor</span>
    <span class="kid-sub">Reading</span>
    <span class="tap-hint">▼</span>
  </a>
</body>
</html>
