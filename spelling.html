<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F766E">
  <title>Spelling</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Nunito', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100%; background: linear-gradient(160deg, #2DD4BF, #0F766E);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 52px 16px 16px;
      touch-action: manipulation;
    }
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 100;
    }
    #word-count { font-size: 14px; font-weight: 800; color: rgba(255,255,255,0.7); flex: 1; text-align: center; }
    .btn-icon {
      background: none; border: none; cursor: pointer; font-size: 22px;
      padding: 6px; border-radius: 50%; opacity: 0.65;
      -webkit-tap-highlight-color: transparent; line-height: 1;
      transition: transform 0.1s; flex-shrink: 0;
    }
    .btn-icon:active { transform: scale(0.88); }
    .card {
      background: rgba(255,255,255,0.13); border-radius: 20px;
      padding: 16px 18px 14px; width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #speak-btn {
      font-size: 48px; background: none; border: none; cursor: pointer;
      line-height: 1; -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s;
    }
    #speak-btn:active { transform: scale(0.88); }
    .hear-label {
      font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.72);
      margin-top: -4px; max-width: 260px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hint {
      font-size: clamp(18px, 4.5vw, 28px); font-weight: 900;
      color: rgba(255,255,255,0.55); letter-spacing: 0.25em; font-family: monospace;
      word-break: break-all; text-align: center;
    }
    #input-field {
      width: 100%; padding: 10px 14px; border-radius: 14px;
      border: 3px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.92);
      font-family: 'Nunito', sans-serif; font-size: clamp(22px, 5.5vw, 36px);
      font-weight: 900; text-align: center; color: #0F766E;
      outline: none; -webkit-appearance: none; transition: border-color 0.15s;
    }
    #input-field:focus { border-color: rgba(255,255,255,0.9); }
    #input-field.wrong { animation: shake 0.38s ease-in-out; border-color: #EF4444; }
    @keyframes shake { 0%,100%{transform:translateX(0);}20%{transform:translateX(-10px);}40%{transform:translateX(10px);}60%{transform:translateX(-8px);}80%{transform:translateX(5px);} }
    #submit-btn {
      width: 100%; padding: 11px; border-radius: 14px; border: none;
      background: rgba(255,255,255,0.92); color: #0F766E;
      font-family: 'Nunito', sans-serif; font-size: 19px; font-weight: 900;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, opacity 0.1s;
    }
    #submit-btn:active { transform: scale(0.97); opacity: 0.85; }
    #skip-btn-card {
      font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.5);
      background: none; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #celebration { position: fixed; inset: 0; pointer-events: none; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .confetti-wrap { position: absolute; inset: 0; overflow: hidden; }
    .cp { position: absolute; animation: cfall linear forwards; }
    @keyframes cfall { from { transform: translateY(-80px) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(600deg); opacity: 0; } }
    .big-word-cel {
      font-family: 'Nunito', sans-serif; font-size: clamp(40px, 10vw, 90px); font-weight: 900;
      background: rgba(255,255,255,0.93); border-radius: 20px; padding: 10px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25); animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
      color: #0F766E;
    }
    @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ── Game overlay ─────────────────────────────────────────────────────── */
    #game-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: #111; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #game-overlay.active { display: flex; }

    /* Picker */
    #section-picker { display: none; flex-direction: column; align-items: center; gap: 22px; }
    #game-pick-title {
      font-family: 'Nunito', sans-serif; font-size: 30px; font-weight: 900;
      color: #2DD4BF; text-align: center;
    }
    #game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .game-opt {
      background: #1e1e1e; border: 3px solid #2DD4BF; border-radius: 18px;
      color: #fff; font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 900;
      padding: 18px 22px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 6px; min-width: 128px;
      -webkit-tap-highlight-color: transparent; transition: background 0.12s, transform 0.1s;
    }
    .game-opt .gi { font-size: 38px; line-height: 1; }
    .game-opt:active { background: #0F766E; transform: scale(0.94); }

    /* Snake */
    #section-snake { display: none; flex-direction: column; align-items: center; gap: 12px; }
    #snake-msg {
      color: #2DD4BF; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; text-align: center;
    }
    #snake-canvas { border: 3px solid #2DD4BF; border-radius: 6px; display: block; touch-action: none; }

    /* D-pad (snake control) */
    #dpad {
      position: fixed; bottom: 24px; left: 24px;
      display: none; user-select: none; z-index: 600;
      grid-template-columns: 72px 72px 72px;
      grid-template-rows: 72px 72px 72px;
      gap: 6px;
    }
    #dpad.active { display: grid; }
    .dp {
      background: #2e2e2e; border: none; border-radius: 10px;
      color: #fff; font-size: 22px; cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; transition: background 0.1s;
      box-shadow: 0 3px 0 #111;
    }
    .dp:active { background: #0F766E; }
    .dp.blank { background: transparent; box-shadow: none; pointer-events: none; }

    /* Tic-Tac-Toe */
    #section-ttt { display: none; flex-direction: column; align-items: center; gap: 18px; }
    #ttt-status {
      color: #2DD4BF; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900;
      text-align: center; min-height: 34px;
    }
    #ttt-board {
      display: grid; grid-template-columns: repeat(3, 88px); grid-template-rows: repeat(3, 88px); gap: 8px;
    }
    .ttt-cell {
      width: 88px; height: 88px; background: #1e1e1e; border: 3px solid #2DD4BF; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .ttt-cell:active:not(.taken) { background: #0a3030; }
    .ttt-cell.win { background: #0F766E; border-color: #2DD4BF; }

    /* Memory Match */
    #section-memory { display: none; flex-direction: column; align-items: center; gap: 14px; }
    #mem-status {
      color: #2DD4BF; font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 900; text-align: center;
    }
    #mem-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(320px, 90vw); }
    .mem-card {
      aspect-ratio: 1; border-radius: 10px; cursor: pointer;
      position: relative; -webkit-tap-highlight-color: transparent;
      transition: transform 0.3s; transform-style: preserve-3d;
      perspective: 400px;
    }
    .mem-card.flipped { transform: rotateY(180deg); }
    .mem-front, .mem-back {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; backface-visibility: hidden;
    }
    .mem-front { background: #2DD4BF; font-size: min(28px, 7vw); color: #111; }
    .mem-back { background: #1e1e1e; border: 2px solid #2DD4BF; transform: rotateY(180deg); font-size: min(28px, 7vw); }
    .mem-card.matched .mem-back { background: #0F766E; border-color: #2DD4BF; }

    /* Pong */
    #section-pong { display: none; flex-direction: column; align-items: center; gap: 10px; }
    #pong-score {
      color: #2DD4BF; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 0.05em;
    }
    #pong-canvas { border: 3px solid #2DD4BF; border-radius: 6px; display: block; touch-action: none; }
    #pong-msg {
      color: rgba(255,255,255,0.6); font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
      text-align: center; min-height: 22px;
    }
  </style>
</head>
<body>
<div id="top-bar">
  <button class="btn-icon" id="home-btn" aria-label="Home">🏠</button>
  <span id="word-count">1/113 · ✓ 0</span>
  <button class="btn-icon" id="voice-btn" aria-label="Change voice" title="Cycle voice">🎙️</button>
</div>

<div class="card">
  <button id="speak-btn" aria-label="Hear word">🔊</button>
  <div class="hear-label" id="hear-label">Tap to hear the word</div>
  <div class="hint" id="hint">_ _ _ _ _</div>
  <input id="input-field" type="text"
    autocomplete="off" autocorrect="off"
    autocapitalize="none" spellcheck="false"
    inputmode="text" placeholder="type here…" />
  <button id="submit-btn">Check ✓</button>
  <button id="skip-btn-card">Skip ➡️</button>
</div>

<div id="celebration"></div>

<!-- ── Game overlay ─────────────────────────────────────────────────────── -->
<div id="game-overlay">

  <div id="section-picker">
    <div id="game-pick-title">🎮 Game Time!</div>
    <div id="game-grid">
      <button class="game-opt" id="opt-snake"><span class="gi">🐍</span>Snake</button>
      <button class="game-opt" id="opt-ttt"><span class="gi">⬜</span>Tic-Tac-Toe</button>
      <button class="game-opt" id="opt-memory"><span class="gi">🧠</span>Memory</button>
      <button class="game-opt" id="opt-pong"><span class="gi">🏓</span>Pong</button>
    </div>
  </div>

  <div id="section-snake">
    <div id="snake-msg">🐍 Snake!</div>
    <canvas id="snake-canvas"></canvas>
  </div>

  <div id="section-ttt">
    <div id="ttt-status">Your turn! ❌</div>
    <div id="ttt-board"></div>
  </div>

  <div id="section-memory">
    <div id="mem-status">🧠 Match the pairs!</div>
    <div id="mem-board"></div>
  </div>

  <div id="section-pong">
    <div id="pong-score">You: 0 &nbsp;·&nbsp; CPU: 0</div>
    <canvas id="pong-canvas"></canvas>
    <div id="pong-msg">Slide your finger to move</div>
  </div>

</div>

<!-- D-pad for snake -->
<div id="dpad">
  <div class="dp blank"></div>
  <button class="dp" id="dp-up">▲</button>
  <div class="dp blank"></div>
  <button class="dp" id="dp-left">◀</button>
  <div class="dp blank"></div>
  <button class="dp" id="dp-right">▶</button>
  <div class="dp blank"></div>
  <button class="dp" id="dp-down">▼</button>
  <div class="dp blank"></div>
</div>

<script>
// ── Words ──────────────────────────────────────────────────────────────────
const WORDS = [
  'after','again','any','ask','could','every','fly','from','give','had',
  'has','her','him','his','how','just','know','let','live','may',
  'old','once','open','over','put','round','some','stop','take','thank',
  'them','then','think','walk','were','when',
  'always','around','because','before','best','both','buy','call','cold',
  'does','fast','first','five','found','gave','goes','green','made','many',
  'pull','read','right','sing','sit','sleep','tell','these','those',
  'very','wash','which','why','wish','work','would','write','your',
  'funny','happy','jump','light','long','never','short','small','together',
  'water','young','above','begin','black','bring','clean','color','draw',
  'drink','eight','fall','full','hold','hot','hurt','keep','kind','laugh',
  'much','myself','only','pick','please','seven','show','start','today',
  'under','until','warm',
];
for (let i = WORDS.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [WORDS[i], WORDS[j]] = [WORDS[j], WORDS[i]];
}

const state = { idx: 0, mastered: new Set(), celebrating: false, correctStreak: 0 };

function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem('spelling_v1') || 'null');
    if (d) state.mastered = new Set(d.mastered || []);
  } catch(_) {}
}
function saveProgress() {
  try { localStorage.setItem('spelling_v1', JSON.stringify({ mastered: [...state.mastered] })); } catch(_) {}
}
const cur = () => WORDS[state.idx];

function render(speakIt) {
  const w = cur();
  document.getElementById('hint').textContent = w.split('').map(() => '_').join(' ');
  document.getElementById('input-field').value = '';
  document.getElementById('word-count').textContent =
    (state.idx + 1) + '/' + WORDS.length + ' · ✓ ' + state.mastered.size;
  if (speakIt) speakWord();
}

// ── Voice ──────────────────────────────────────────────────────────────────
let voices = [], voiceIdx = 0;

function loadVoices() {
  const all = window.speechSynthesis.getVoices();
  const en = all.filter(v => v.lang.startsWith('en'));
  voices = en.length > 0 ? en : all;
  const saved = localStorage.getItem('spelling_voice');
  if (saved) { const i = voices.findIndex(v => v.name === saved); if (i >= 0) voiceIdx = i; }
  updateVoiceLabel();
}

function updateVoiceLabel() {
  const el = document.getElementById('hear-label');
  if (voices.length > 1) {
    let n = voices[voiceIdx].name
      .replace(' (Enhanced)', ' ★').replace(' (Compact)', '').replace('(en-US)', '').trim();
    el.textContent = '🎙️ ' + n;
  } else {
    el.textContent = 'Tap to hear the word';
  }
}

function cycleVoice() {
  if (voices.length < 2) return;
  voiceIdx = (voiceIdx + 1) % voices.length;
  try { localStorage.setItem('spelling_voice', voices[voiceIdx].name); } catch(_) {}
  updateVoiceLabel();
  speakWord();
}

function speakWord() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cur());
  u.lang = 'en-US'; u.rate = 0.65; u.pitch = 1.05;
  if (voices.length > 0) u.voice = voices[voiceIdx];
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

// ── Spelling logic ─────────────────────────────────────────────────────────
function next(speakIt = true) {
  state.idx = (state.idx + 1) % WORDS.length;
  render(speakIt);
}

function checkSpelling() {
  if (state.celebrating) return;
  const input = document.getElementById('input-field').value.trim().toLowerCase();
  if (!input) return;
  if (input === cur().toLowerCase()) { celebrate(); }
  else { shakeInput(); }
}

function shakeInput() {
  const el = document.getElementById('input-field');
  el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  setTimeout(() => { el.classList.remove('wrong'); el.value = ''; el.focus(); }, 400);
}

function celebrate() {
  state.celebrating = true;
  state.mastered.add(cur());
  saveProgress();
  state.correctStreak++;
  const ov = document.getElementById('celebration');
  ov.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'confetti-wrap';
  const EM = ['⭐','🌟','✨','🎉','🎊','🌈','💚','💛','❤️'];
  for (let i = 0; i < 28; i++) {
    const cp = document.createElement('div'); cp.className = 'cp';
    cp.textContent = EM[i % EM.length];
    cp.style.cssText = 'left:' + Math.random()*100 + 'vw;top:-70px;font-size:' +
      (18 + Math.random()*26) + 'px;animation-duration:' + (0.7 + Math.random()*0.9) +
      's;animation-delay:' + Math.random()*0.35 + 's;';
    wrap.appendChild(cp);
  }
  ov.appendChild(wrap);
  const bw = document.createElement('div'); bw.className = 'big-word-cel';
  bw.textContent = cur();
  ov.appendChild(bw);
  setTimeout(() => {
    ov.innerHTML = ''; state.celebrating = false;
    if (state.correctStreak % 5 === 0) { showGamePicker(); }
    else { next(true); }
  }, 1350);
}

document.getElementById('speak-btn')    .addEventListener('click', speakWord);
document.getElementById('voice-btn')    .addEventListener('click', cycleVoice);
document.getElementById('submit-btn')   .addEventListener('click', checkSpelling);
document.getElementById('skip-btn-card').addEventListener('click', () => { if (!state.celebrating) next(false); });
document.getElementById('input-field')  .addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkSpelling(); } });

const fromSilabas = new URLSearchParams(window.location.search).get('from') === 'silabas';
document.getElementById('home-btn').addEventListener('click', () => window.location.href = fromSilabas ? 'silabas.html' : 'scout.html');

// ── Game picker ────────────────────────────────────────────────────────────
function showSection(id) {
  ['section-picker','section-snake','section-ttt','section-memory','section-pong'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = 'flex';
}

function showGamePicker() {
  document.getElementById('game-overlay').classList.add('active');
  showSection('section-picker');
}

function endMiniGame() {
  document.getElementById('game-overlay').classList.remove('active');
  document.getElementById('dpad').classList.remove('active');
  if (snake.timer) { clearInterval(snake.timer); snake.timer = null; }
  if (pong.timer)  { clearInterval(pong.timer);  pong.timer  = null; }
  snake.active = false;
  pong.active  = false;
  if (fromSilabas) { window.location.href = 'silabas.html'; return; }
  next(true);
}

document.getElementById('opt-snake') .addEventListener('click', () => { showSection('section-snake');  launchSnake(); });
document.getElementById('opt-ttt')   .addEventListener('click', () => { showSection('section-ttt');    launchTTT(); });
document.getElementById('opt-memory').addEventListener('click', () => { showSection('section-memory'); launchMemory(); });
document.getElementById('opt-pong')  .addEventListener('click', () => { showSection('section-pong');   launchPong(); });

// ── Shared canvas helper ───────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// ── Snake ──────────────────────────────────────────────────────────────────
const snake = {
  active: false, dir: {x:1,y:0}, nextDir: {x:1,y:0},
  body: [], food: {x:0,y:0}, timer: null,
  COLS: 20, ROWS: 20, CELL: 16, canvas: null, ctx: null,
};

function launchSnake() {
  const canvas = document.getElementById('snake-canvas');
  const maxW = Math.min(window.innerWidth - 48, 380);
  snake.COLS = Math.floor(maxW / snake.CELL);
  snake.ROWS = Math.floor((window.innerHeight * 0.62) / snake.CELL);
  canvas.width  = snake.COLS * snake.CELL;
  canvas.height = snake.ROWS * snake.CELL;
  const mid = { x: Math.floor(snake.COLS/2), y: Math.floor(snake.ROWS/2) };
  snake.body = [mid, {x:mid.x-1,y:mid.y}, {x:mid.x-2,y:mid.y}];
  snake.dir  = {x:1,y:0}; snake.nextDir = {x:1,y:0};
  placeFood();
  snake.canvas = canvas; snake.ctx = canvas.getContext('2d');
  document.getElementById('snake-msg').textContent = '🐍 Snake!';
  document.getElementById('dpad').classList.add('active');
  snake.active = true;
  if (snake.timer) clearInterval(snake.timer);
  snake.timer = setInterval(snakeTick, 220);
}

function placeFood() {
  const occ = new Set(snake.body.map(s => s.x+','+s.y));
  let f;
  do { f = {x:Math.floor(Math.random()*snake.COLS), y:Math.floor(Math.random()*snake.ROWS)}; }
  while (occ.has(f.x+','+f.y));
  snake.food = f;
}

function snakeTick() {
  snake.dir = snake.nextDir;
  const head = snake.body[0];
  const nh = {x:(head.x+snake.dir.x+snake.COLS)%snake.COLS, y:(head.y+snake.dir.y+snake.ROWS)%snake.ROWS};
  if (snake.body.some(s => s.x===nh.x && s.y===nh.y)) { snakeDie(); return; }
  snake.body.unshift(nh);
  if (nh.x===snake.food.x && nh.y===snake.food.y) { placeFood(); } else { snake.body.pop(); }
  drawSnake();
}

function drawSnake() {
  const {canvas,ctx} = snake; const C = snake.CELL;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#2DD4BF';
  ctx.beginPath(); ctx.arc(snake.food.x*C+C/2, snake.food.y*C+C/2, C/2-1, 0, Math.PI*2); ctx.fill();
  snake.body.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#fff' : '#2DD4BF';
    roundRect(ctx, s.x*C+1, s.y*C+1, C-2, C-2, i===0?4:3); ctx.fill();
  });
}

function snakeDie() {
  clearInterval(snake.timer); snake.timer = null; snake.active = false;
  document.getElementById('snake-msg').textContent = '💀 Game over!';
  snake.body.forEach(s => {
    snake.ctx.fillStyle='#EF4444';
    roundRect(snake.ctx, s.x*snake.CELL+1, s.y*snake.CELL+1, snake.CELL-2, snake.CELL-2, 3);
    snake.ctx.fill();
  });
  setTimeout(endMiniGame, 1200);
}

function setDir(dx, dy) {
  if (!snake.active) return;
  if (dx!==0 && snake.dir.x!==0) return;
  if (dy!==0 && snake.dir.y!==0) return;
  snake.nextDir = {x:dx, y:dy};
}
document.getElementById('dp-up')   .addEventListener('click', () => setDir(0,-1));
document.getElementById('dp-down') .addEventListener('click', () => setDir(0, 1));
document.getElementById('dp-left') .addEventListener('click', () => setDir(-1,0));
document.getElementById('dp-right').addEventListener('click', () => setDir( 1,0));
document.addEventListener('keydown', e => {
  if (!snake.active) return;
  const map = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if (map[e.key]) { e.preventDefault(); setDir(...map[e.key]); }
});

// ── Tic-Tac-Toe ────────────────────────────────────────────────────────────
const ttt = { board: Array(9).fill(null), over: false, busy: false };

function launchTTT() {
  ttt.board = Array(9).fill(null); ttt.over = false; ttt.busy = false;
  document.getElementById('ttt-status').textContent = 'Your turn! ❌';
  renderTTT();
}

function renderTTT() {
  const board = document.getElementById('ttt-board');
  board.innerHTML = '';
  ttt.board.forEach((v, i) => {
    const el = document.createElement('div');
    el.className = 'ttt-cell' + (v ? ' taken' : '');
    el.textContent = v === 'X' ? '❌' : v === 'O' ? '⭕' : '';
    if (!ttt.over && !v && !ttt.busy) el.addEventListener('click', () => tttPlay(i));
    board.appendChild(el);
  });
}

function tttPlay(i) {
  if (ttt.over || ttt.board[i] || ttt.busy) return;
  ttt.board[i] = 'X';
  renderTTT();
  const w = tttWinner(ttt.board);
  if (w || ttt.board.every(c => c)) { tttEnd(w); return; }
  ttt.busy = true;
  document.getElementById('ttt-status').textContent = '🤔 Thinking…';
  setTimeout(() => {
    const move = tttBest(ttt.board);
    if (move >= 0) ttt.board[move] = 'O';
    renderTTT();
    ttt.busy = false;
    const w2 = tttWinner(ttt.board);
    if (w2 || ttt.board.every(c => c)) { tttEnd(w2); }
    else { document.getElementById('ttt-status').textContent = 'Your turn! ❌'; }
  }, 450);
}

const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function tttWinner(b) {
  for (const [a,c,d] of TTT_LINES) if (b[a] && b[a]===b[c] && b[a]===b[d]) return b[a];
  return null;
}

function tttBest(b) {
  let best = -Infinity, move = -1;
  for (let i = 0; i < 9; i++) {
    if (!b[i]) {
      b[i]='O'; const s=tttMini(b,false,0); b[i]=null;
      if (s > best) { best=s; move=i; }
    }
  }
  return move;
}

function tttMini(b, isMax, d) {
  const w = tttWinner(b);
  if (w==='O') return 10-d; if (w==='X') return d-10;
  if (b.every(c=>c)) return 0;
  if (isMax) {
    let v=-Infinity; for(let i=0;i<9;i++) if(!b[i]){b[i]='O';v=Math.max(v,tttMini(b,false,d+1));b[i]=null;} return v;
  } else {
    let v=Infinity; for(let i=0;i<9;i++) if(!b[i]){b[i]='X';v=Math.min(v,tttMini(b,true,d+1));b[i]=null;} return v;
  }
}

function tttEnd(winner) {
  ttt.over = true;
  if (winner) {
    const cells = document.getElementById('ttt-board').children;
    TTT_LINES.forEach(([a,c,d]) => {
      if (ttt.board[a] && ttt.board[a]===ttt.board[c] && ttt.board[a]===ttt.board[d])
        [a,c,d].forEach(i => cells[i].classList.add('win'));
    });
  }
  const msg = !winner ? "It's a draw! 🤝" : winner==='X' ? '🎉 You win!' : '🤖 Computer wins!';
  document.getElementById('ttt-status').textContent = msg;
  setTimeout(endMiniGame, 2000);
}

// ── Memory Match ───────────────────────────────────────────────────────────
const MEM_EM = ['🌟','🎉','🦋','🌈','🍕','🐶','🎸','🦄','🌸','🚀','🍦','🎨'];
const mem = { cards: [], flipped: [], matched: 0, locked: false };

function launchMemory() {
  const pairs = [...MEM_EM, ...MEM_EM];
  for (let i=pairs.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [pairs[i],pairs[j]]=[pairs[j],pairs[i]]; }
  mem.cards = pairs.map((e,i) => ({emoji:e, id:i, flipped:false, matched:false}));
  mem.flipped=[]; mem.matched=0; mem.locked=false;
  document.getElementById('mem-status').textContent = '🧠 Match the pairs!';
  renderMemory();
}

function renderMemory() {
  const board = document.getElementById('mem-board');
  board.innerHTML = '';
  mem.cards.forEach((card,i) => {
    const el = document.createElement('div');
    el.className = 'mem-card' + (card.flipped||card.matched?' flipped':'') + (card.matched?' matched':'');
    el.innerHTML = '<div class="mem-front">❓</div><div class="mem-back">' + card.emoji + '</div>';
    if (!card.matched) el.addEventListener('click', () => memFlip(i));
    board.appendChild(el);
  });
}

function memFlip(i) {
  if (mem.locked || mem.cards[i].flipped || mem.cards[i].matched) return;
  mem.cards[i].flipped = true;
  mem.flipped.push(i);
  renderMemory();
  if (mem.flipped.length === 2) {
    mem.locked = true;
    const [a,b] = mem.flipped;
    setTimeout(() => {
      if (mem.cards[a].emoji === mem.cards[b].emoji) {
        mem.cards[a].matched = mem.cards[b].matched = true;
        mem.matched += 2;
        if (mem.matched === mem.cards.length) {
          document.getElementById('mem-status').textContent = '🎉 All matched!';
          setTimeout(endMiniGame, 1500);
        }
      } else {
        mem.cards[a].flipped = mem.cards[b].flipped = false;
      }
      mem.flipped=[]; mem.locked=false;
      renderMemory();
    }, 800);
  }
}

// ── Pong ───────────────────────────────────────────────────────────────────
const pong = {
  active: false, timer: null,
  bx:0, by:0, bvx:0, bvy:0,
  pw:0, ph:12, px:0, cx:0,
  sp:0, sc:0, W:0, H:0,
  canvas:null, ctx:null,
};

function launchPong() {
  const canvas = document.getElementById('pong-canvas');
  pong.W = Math.min(window.innerWidth - 32, 360);
  pong.H = Math.min(Math.floor(window.innerHeight * 0.58), 450);
  canvas.width = pong.W; canvas.height = pong.H;
  pong.canvas = canvas; pong.ctx = canvas.getContext('2d');
  pong.pw = Math.floor(pong.W * 0.28);
  pong.px = (pong.W - pong.pw) / 2;
  pong.cx = (pong.W - pong.pw) / 2;
  pong.sp = 0; pong.sc = 0;
  document.getElementById('pong-score').textContent = 'You: 0 · CPU: 0';
  document.getElementById('pong-msg').textContent = 'Slide your finger to move';
  pongResetBall();
  pong.active = true;
  if (pong.timer) clearInterval(pong.timer);
  pong.timer = setInterval(pongTick, 16);

  canvas.ontouchstart = canvas.ontouchmove = (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches[0].clientX - rect.left) * (pong.W / rect.width);
    pong.px = Math.max(0, Math.min(pong.W - pong.pw, x - pong.pw/2));
  };
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (pong.W / rect.width);
    pong.px = Math.max(0, Math.min(pong.W - pong.pw, x - pong.pw/2));
  };
}

function pongResetBall() {
  pong.bx = pong.W / 2; pong.by = pong.H / 2;
  const spd = 4.5, ang = (Math.random()*50-25) * Math.PI/180;
  pong.bvx = Math.sin(ang) * spd;
  pong.bvy = (Math.random()<0.5?1:-1) * Math.cos(ang) * spd;
}

function pongTick() {
  if (!pong.active) return;
  const {W,H,pw,ph} = pong; const R=8;
  pong.bx += pong.bvx; pong.by += pong.bvy;

  // Wall bounce
  if (pong.bx-R<0)  { pong.bx=R;  pong.bvx=Math.abs(pong.bvx); }
  if (pong.bx+R>W)  { pong.bx=W-R; pong.bvx=-Math.abs(pong.bvx); }

  // CPU AI (slightly imperfect)
  const cpuSpd=3.2, mid=pong.cx+pw/2;
  if (mid < pong.bx-3) pong.cx=Math.min(W-pw, pong.cx+cpuSpd);
  else if (mid > pong.bx+3) pong.cx=Math.max(0, pong.cx-cpuSpd);

  // Player paddle (bottom)
  const pt=H-ph-10;
  if (pong.bvy>0 && pong.by+R>=pt && pong.by-R<=pt+ph && pong.bx>=pong.px && pong.bx<=pong.px+pw) {
    pong.bvy=-Math.abs(pong.bvy);
    pong.bvx = ((pong.bx-(pong.px+pw/2))/(pw/2))*5;
  }
  // CPU paddle (top)
  const cb=ph+10;
  if (pong.bvy<0 && pong.by-R<=cb && pong.by+R>=10 && pong.bx>=pong.cx && pong.bx<=pong.cx+pw) {
    pong.bvy=Math.abs(pong.bvy);
    pong.bvx = ((pong.bx-(pong.cx+pw/2))/(pw/2))*5;
  }

  // Score
  if (pong.by>H) {
    pong.sc++;
    document.getElementById('pong-score').textContent = `You: ${pong.sp} · CPU: ${pong.sc}`;
    if (pong.sc>=5) { pongEnd('🤖 CPU wins!'); return; }
    pongResetBall();
  }
  if (pong.by<0) {
    pong.sp++;
    document.getElementById('pong-score').textContent = `You: ${pong.sp} · CPU: ${pong.sc}`;
    if (pong.sp>=5) { pongEnd('🎉 You win!'); return; }
    pongResetBall();
  }

  drawPong();
}

function drawPong() {
  const {ctx,W,H,pw,ph} = pong; const R=8;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  // centre line
  ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  ctx.setLineDash([]);
  // ball
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(pong.bx,pong.by,R,0,Math.PI*2); ctx.fill();
  // cpu paddle (top, teal)
  ctx.fillStyle='#2DD4BF';
  roundRect(ctx,pong.cx,10,pw,ph,4); ctx.fill();
  // player paddle (bottom, white)
  ctx.fillStyle='#fff';
  roundRect(ctx,pong.px,H-ph-10,pw,ph,4); ctx.fill();
}

function pongEnd(msg) {
  clearInterval(pong.timer); pong.timer=null; pong.active=false;
  document.getElementById('pong-msg').textContent = msg;
  setTimeout(endMiniGame, 1800);
}

// ── Boot ───────────────────────────────────────────────────────────────────
loadProgress(); render(false);
if (fromSilabas) { showGamePicker(); }
